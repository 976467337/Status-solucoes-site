<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Status Soluções — Área do dono (postar fotos/vídeos)</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12161A; --surface: #1B2126; --surface-2: #222A30; --line: #2E383F;
    --text: #EDEFF1; --muted: #93A1AB; --volt: #2F8FE0; --neon: #4FE3D0;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    background: var(--bg); color: var(--text); font-family:'Work Sans', 'Segoe UI', sans-serif;
    min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 24px;
    line-height: 1.5;
  }
  h1,h2{ font-family:'Barlow Condensed','Arial Narrow',sans-serif; text-transform: uppercase; letter-spacing:0.02em; }
  .wrap{ width: 100%; max-width: 640px; }
  .top-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 16px; }
  .back-link{ color: var(--muted); font-size: 0.85rem; text-decoration:none; }
  .back-link:hover{ color: var(--volt); }
  .card{ background: var(--surface); border:1px solid var(--line); border-radius: 8px; padding: 32px; margin-bottom: 24px; }
  h1{ font-size: 1.6rem; margin-bottom: 6px; }
  .sub{ color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
  label{ display:block; font-size: 0.78rem; text-transform: uppercase; letter-spacing:0.05em; color: var(--muted); margin: 16px 0 6px; }
  label:first-of-type{ margin-top: 0; }
  input, select{
    width: 100%; background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    padding: 12px 14px; border-radius: 4px; font-family: inherit; font-size: 0.95rem;
  }
  input:focus, select:focus{ outline:none; border-color: var(--volt); }
  input[type="file"]{ padding: 10px; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
    background: var(--volt); color:#F5FAFF; border:none; border-radius:4px; padding: 14px;
    font-weight:700; font-size:0.95rem; text-transform:uppercase; letter-spacing:0.03em;
    cursor:pointer; margin-top: 22px; font-family: inherit;
  }
  .btn:hover{ background:#57A8EE; }
  .btn:disabled{ opacity:0.6; cursor:not-allowed; }
  .msg{ margin-top: 16px; padding: 12px 14px; border-radius: 4px; font-size: 0.88rem; display:none; }
  .msg.ok{ display:block; background: rgba(79,227,208,0.12); border:1px solid var(--neon); color: var(--neon); }
  .msg.err{ display:block; background: rgba(224,79,79,0.12); border:1px solid #E04F4F; color:#FF8B8B; }
  .hint{ color: var(--muted); font-size: 0.8rem; margin-top: 6px; }

  .item{
    display:flex; gap: 14px; align-items:center; padding: 12px; border:1px solid var(--line);
    border-radius: 4px; margin-bottom: 10px; background: var(--surface-2);
  }
  .item img, .item video{ width: 64px; height: 64px; object-fit: cover; border-radius: 3px; background:#000; flex-shrink:0; }
  .item .info{ flex:1; min-width:0; }
  .item .info b{ display:block; font-size: 0.9rem; }
  .item .info span{ color: var(--muted); font-size: 0.78rem; text-transform:uppercase; }
  .item button{
    background:none; border:1px solid var(--line); color: var(--muted); border-radius:4px;
    padding: 8px 12px; font-size:0.78rem; cursor:pointer; font-family:inherit; text-transform:uppercase;
  }
  .item button:hover{ border-color:#E04F4F; color:#FF8B8B; }
  .empty{ color: var(--muted); font-size: 0.9rem; text-align:center; padding: 20px 0; }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-row">
    <a class="back-link" href="index.html" id="backLink">← Voltar ao site</a>
  </div>

  <div class="card">
    <h1>Postar foto ou vídeo</h1>
    <p class="sub">Área restrita da Status Soluções Integradas — o que você enviar aqui aparece automaticamente no portfólio do site.</p>

    <form id="uploadForm">
      <label for="titulo">Título / legenda</label>
      <input type="text" id="titulo" placeholder="Ex: Instalação elétrica residencial em Cotia" required>

      <label for="categoria">Categoria</label>
      <select id="categoria" required>
        <option value="solar">Energia solar</option>
        <option value="carregador">Carregadores para veículos elétricos</option>
        <option value="projetos-manutencao">Projetos e manutenção elétrica</option>
        <option value="shoppings-restaurantes">Elétrica de shoppings e restaurantes</option>
        <option value="reestruturacao-predial">Reestruturação predial</option>
        <option value="stands-financeiras">Stands e financeiras</option>
        <option value="comercial">Elétrica comercial</option>
        <option value="predial">Elétrica predial</option>
        <option value="industrial">Elétrica industrial</option>
        <option value="residencial">Elétrica residencial</option>
        <option value="iluminacao">Instalação de iluminação</option>
        <option value="cabeamento-soquetes">Cabeamento e conserto de soquetes</option>
        <option value="disjuntor">Painel do disjuntor</option>
        <option value="cabeamento-estruturado">Cabeamento estruturado</option>
        <option value="marcenaria">Marcenaria e serralheria</option>
        <option value="pedreiro">Serviços de pedreiro</option>
        <option value="vidraceiro">Serviços de vidraceiro</option>
        <option value="pintura">Serviços de pintura</option>
        <option value="epi">EPI</option>
        <option value="outro">Outro</option>
      </select>

      <label for="arquivo">Foto ou vídeo</label>
      <input type="file" id="arquivo" accept="image/*,video/*" required>
      <p class="hint">Tamanho máximo: 20MB por arquivo.</p>

      <button class="btn" id="submitBtn" type="submit">Publicar no site</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <div class="card">
    <h2>Já publicados</h2>
    <div id="itemsList"><p class="empty">Carregando…</p></div>
  </div>
</div>

<script>
  const API = 'https://status-depoimentos.rieres.workers.dev';
  const SESSION_KEY = 'status_admin_pw';

  // require login.html first — never show this page without a verified session
  const sessionPassword = sessionStorage.getItem(SESSION_KEY);
  if (!sessionPassword) {
    window.location.href = 'login.html';
  }

  // sai da area restrita sozinho ao voltar pro site (fechar a aba/janela
  // ja limpa a sessao naturalmente, por ser sessionStorage)
  document.getElementById('backLink').addEventListener('click', () => {
    sessionStorage.removeItem(SESSION_KEY);
  });

  function fmtDate(ts){
    return new Date(ts).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' });
  }

  async function loadItems(){
    const list = document.getElementById('itemsList');
    try {
      const resp = await fetch(API + '/portfolio/list');
      const items = await resp.json();
      if (!items.length) {
        list.innerHTML = '<p class="empty">Nenhum item publicado ainda.</p>';
        return;
      }
      list.innerHTML = items.map(item => {
        const media = item.tipo === 'video'
          ? `<video src="${API}/media/${item.id}" muted></video>`
          : `<img src="${API}/media/${item.id}" alt="">`;
        return `
          <div class="item" data-id="${item.id}">
            ${media}
            <div class="info">
              <b>${item.titulo}</b>
              <span>${item.categoria} · ${item.tipo} · ${fmtDate(item.createdAt)}</span>
            </div>
            <button type="button" class="delete-btn" data-id="${item.id}">Remover</button>
          </div>
        `;
      }).join('');

      list.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => removeItem(btn.dataset.id));
      });
    } catch (err) {
      list.innerHTML = '<p class="empty">Não foi possível carregar a lista agora.</p>';
    }
  }

  async function removeItem(id){
    if (!confirm('Remover este item do portfólio?')) return;
    try {
      const resp = await fetch(API + '/portfolio/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: sessionPassword, id }),
      });
      const data = await resp.json();
      if (data.ok) {
        loadItems();
      } else {
        alert('Não foi possível remover.');
      }
    } catch (err) {
      alert('Erro ao remover. Tente novamente.');
    }
  }

  function readImageDimensions(file){
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        resolve({ width: img.naturalWidth, height: img.naturalHeight });
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('invalid_image')); };
      img.src = url;
    });
  }

  document.getElementById('uploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');
    msg.className = 'msg';
    msg.textContent = '';

    const titulo = document.getElementById('titulo').value;
    const categoria = document.getElementById('categoria').value;
    const arquivo = document.getElementById('arquivo').files[0];

    if (!arquivo) return;
    if (arquivo.size > 20 * 1024 * 1024) {
      msg.className = 'msg err';
      msg.textContent = 'Esse arquivo passa de 20MB. Escolha um arquivo menor ou comprima antes de enviar.';
      return;
    }

    const formData = new FormData();
    formData.append('password', sessionPassword);
    formData.append('titulo', titulo);
    formData.append('categoria', categoria);
    formData.append('arquivo', arquivo);

    // for images, capture natural width/height so the site can decide
    // whether the photo should show taller in the portfolio grid
    if (arquivo.type.startsWith('image/')) {
      try {
        const dims = await readImageDimensions(arquivo);
        formData.append('largura', dims.width);
        formData.append('altura', dims.height);
      } catch (err) {
        // couldn't read dimensions — upload still proceeds, just without the "tall" hint
      }
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando…';

    try {
      const resp = await fetch(API + '/portfolio/upload', { method: 'POST', body: formData });
      const data = await resp.json();
      if (resp.ok && data.ok) {
        msg.className = 'msg ok';
        msg.textContent = 'Publicado! Já deve aparecer no site em instantes.';
        document.getElementById('uploadForm').reset();
        loadItems();
      } else if (resp.status === 401) {
        msg.className = 'msg err';
        msg.textContent = 'Sessão expirada. Saia e entre de novo com a senha.';
      } else if (data.error === 'file_too_large') {
        msg.className = 'msg err';
        msg.textContent = 'Esse arquivo passa de 20MB.';
      } else {
        msg.className = 'msg err';
        msg.textContent = 'Não foi possível publicar. Confira os campos e tente de novo.';
      }
    } catch (err) {
      msg.className = 'msg err';
      msg.textContent = 'Erro de conexão. Tente novamente.';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Publicar no site';
    }
  });

  loadItems();
</script>

</body>
</html>
